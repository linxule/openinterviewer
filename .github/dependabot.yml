version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Provider upgrades also need the explicitly authorized live smoke tier.
      providers:
        patterns:
          - '@anthropic-ai/sdk'
          - '@google/genai'
          - '@openrouter/sdk'
          - ai
          - openai
        update-types: [minor, patch]
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
