version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Tailwind majors need a deliberate migration (pixel diff); keep security updates eligible.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # Types must match the pinned runtime (engines.node, .nvmrc); bump with the Node pin.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # ESLint 10 breaks eslint-plugin-react/-import/-jsx-a11y (peer ranges end at 9);
      # lift once they support it.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Next 16.4 builds, but the OpenNext Worker then answers every request with 500
      # ("Unexpected loadManifest(/.next/server/preview-props.json)"); the artifact lane
      # catches it. Lift when opennextjs/opennextjs-cloudflare#1355 ships in a release.
      - dependency-name: next
        versions: ['>=16.4.0']
    groups:
      # Provider upgrades also need the explicitly authorized live smoke tier.
      providers:
        patterns:
          - '@anthropic-ai/sdk'
          - '@google/genai'
          - '@openrouter/sdk'
          - ai
          - openai
        update-types: [minor, patch]
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
