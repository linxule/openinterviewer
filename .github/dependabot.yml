version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Tailwind 4 needs a deliberate migration; keep security updates eligible.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # Types must match the pinned runtime (engines.node, .nvmrc); bump with the Node pin.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # Provider upgrades also need the explicitly authorized live smoke tier.
      providers:
        patterns:
          - '@anthropic-ai/sdk'
          - '@google/genai'
          - '@openrouter/sdk'
          - ai
          - openai
        update-types: [minor, patch]
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
