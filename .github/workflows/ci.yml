name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_cloudflare:
        description: Promote the checked Cloudflare artifact to the production installation (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Setup tests
        run: npm run test:setup
      - name: Validate standalone deployment contract
        run: npm run setup:check -- --mode standalone --production
        env:
          NODE_ENV: production
          DEPLOYMENT_MODE: standalone
          AI_TRANSPORT: direct
          APP_BASE_URL: https://standalone-build.example.org
          ADMIN_PASSWORD: standalone-build-admin-password
          SESSION_SECRET: standalone-build-session-secret-1234567890
          PARTICIPANT_TOKEN_SECRET: standalone-build-participant-secret-1234567890
          RATE_LIMIT_SALT: standalone-build-rate-limit-salt-1234567890
          KV_REST_API_URL: https://build-test.upstash.io
          KV_REST_API_TOKEN: standalone-build-redis-token
          GEMINI_API_KEY: standalone-build-gemini-key
      - name: Validate Vercel AI Gateway deployment contract
        run: npm run setup:check -- --mode standalone --production
        env:
          NODE_ENV: production
          VERCEL: '1'
          DEPLOYMENT_MODE: standalone
          AI_TRANSPORT: gateway
          AI_PROVIDER: gemini
          APP_BASE_URL: https://gateway-build.example.org
          ADMIN_PASSWORD: gateway-build-admin-password
          SESSION_SECRET: gateway-build-session-secret-1234567890
          PARTICIPANT_TOKEN_SECRET: gateway-build-participant-secret-1234567890
          RATE_LIMIT_SALT: gateway-build-rate-limit-salt-1234567890
          KV_REST_API_URL: https://build-test.upstash.io
          KV_REST_API_TOKEN: gateway-build-redis-token
      - name: Validate hosted deployment contract
        run: npm run setup:check -- --mode hosted --production
        env:
          NODE_ENV: production
          DEPLOYMENT_MODE: hosted
          AI_TRANSPORT: direct
          APP_BASE_URL: https://hosted-build.example.org
          SESSION_SECRET: hosted-build-session-secret-1234567890
          PARTICIPANT_TOKEN_SECRET: hosted-build-participant-secret-1234567890
          RATE_LIMIT_SALT: hosted-build-rate-limit-salt-1234567890
          PLATFORM_KV_REST_API_URL: https://build-test.upstash.io
          PLATFORM_KV_REST_API_TOKEN: hosted-build-platform-token
          PLATFORM_KEY_PREFIX: build-test
          PLATFORM_SCHEMA_LINEAGE: v2-clean
          CREDENTIAL_ENCRYPTION_KEYS: '{"build-test":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
          CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID: build-test
          GOOGLE_CLIENT_ID: hosted-build-google-client
          GOOGLE_CLIENT_SECRET: hosted-build-google-secret
      - name: Build standalone mode
        run: npm run build
        env:
          DEPLOYMENT_MODE: standalone
          AI_TRANSPORT: direct
      - name: Build Vercel AI Gateway mode
        run: npm run build
        env:
          VERCEL: '1'
          DEPLOYMENT_MODE: standalone
          AI_TRANSPORT: gateway
          AI_PROVIDER: gemini
          APP_BASE_URL: https://gateway-build.example.org
          ADMIN_PASSWORD: gateway-build-admin-password
          SESSION_SECRET: gateway-build-session-secret-1234567890
          PARTICIPANT_TOKEN_SECRET: gateway-build-participant-secret-1234567890
          RATE_LIMIT_SALT: gateway-build-rate-limit-salt-1234567890
          KV_REST_API_URL: https://build-test.upstash.io
          KV_REST_API_TOKEN: gateway-build-redis-token
      - name: Build hosted mode
        run: npm run build
        env:
          DEPLOYMENT_MODE: hosted
          AI_TRANSPORT: direct
          APP_BASE_URL: https://hosted-build.example.org
          SESSION_SECRET: hosted-build-session-secret-1234567890
          PARTICIPANT_TOKEN_SECRET: hosted-build-participant-secret-1234567890
          RATE_LIMIT_SALT: hosted-build-rate-limit-salt-1234567890
          PLATFORM_KV_REST_API_URL: https://build-test.upstash.io
          PLATFORM_KV_REST_API_TOKEN: hosted-build-platform-token
          PLATFORM_KEY_PREFIX: build-test
          PLATFORM_SCHEMA_LINEAGE: v2-clean
          CREDENTIAL_ENCRYPTION_KEYS: '{"build-test":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
          CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID: build-test
          GOOGLE_CLIENT_ID: hosted-build-google-client
          GOOGLE_CLIENT_SECRET: hosted-build-google-secret

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOYMENT_MODE: standalone
      ADMIN_PASSWORD: e2e-test-password
      SESSION_SECRET: e2e-test-session-secret-not-for-production
      PARTICIPANT_TOKEN_SECRET: e2e-test-participant-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  redis-crash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Real-Redis crash cuts
        run: npm run test:redis-crash
        env:
          REDIS_URL: ''
      - name: WorkspaceStore contract on real Redis
        run: npm run test:contract:redis
        env:
          REDIS_URL: ''

  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Shared-BYOS adversarial matrix
        run: npm run test:adversarial
        env:
          REDIS_URL: ''

  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Installer and operator tooling
        run: npm run test:setup:cloudflare
      - name: Validate Cloudflare deployment contract
        run: npm run setup:check -- --target cloudflare --mode standalone --production
        env:
          DEPLOYMENT_TARGET: cloudflare
          DEPLOYMENT_MODE: standalone
          AI_TRANSPORT: direct
          AI_PROVIDER: openai
          APP_BASE_URL: https://cloudflare-build.example.org
          ADMIN_PASSWORD: cloudflare-build-admin-password
          SESSION_SECRET: cloudflare-build-session-secret-1234567890
          PARTICIPANT_TOKEN_SECRET: cloudflare-build-participant-secret-1234567890
          RATE_LIMIT_SALT: cloudflare-build-rate-limit-salt-1234567890
          OPENAI_API_KEY: cloudflare-build-openai-key
          WORKSPACE_ID: ws_0123456789abcdef0123456789abcdef
          WORKSPACE_JURISDICTION: ''
          ANALYSIS_RECOVERY_EPOCH: ep_0123456789abcdef0123456789abcdef
      - name: Workers runtime (real local SQLite, alarms, Queue)
        run: npm run test:cloudflare
      - name: Worker-only import boundary
        run: node scripts/cloudflare/check-import-boundary.mjs
      - name: Build Cloudflare artifact
        run: npm run build:cloudflare
      - name: Production-artifact runtime tests
        run: npm run test:cloudflare:artifact
      - run: npx playwright install --with-deps chromium
      - name: Production-artifact browser journeys
        run: npm run test:e2e:cloudflare
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-cloudflare
          path: playwright-report-cloudflare
          if-no-files-found: ignore

  # SETUP-05: the single production deployment owner. Runs only on a manual
  # dispatch from main, after every required lane passed for this exact commit,
  # with the production environment's protection rules and secrets. It builds
  # the artifact once, runs the complete local release check on it (which
  # writes the receipt deploy requires), then deploys that same artifact.
  # Workers Builds push deployments must stay disconnected for this Worker.
  promote-cloudflare:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_cloudflare && github.ref == 'refs/heads/main'
    needs: [quality, browser, redis-crash, adversarial, cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and run the full release check on one artifact
        run: npm run check:cloudflare
        env:
          REDIS_URL: ''
      - name: Write installation configuration (non-secret)
        run: printf '%s' "$CLOUDFLARE_INSTALL_CONFIG" > "$RUNNER_TEMP/install.wrangler.json"
        env:
          CLOUDFLARE_INSTALL_CONFIG: ${{ vars.CLOUDFLARE_INSTALL_CONFIG }}
      - name: Deploy the checked artifact
        run: npm run deploy:cloudflare -- --install "$RUNNER_TEMP/install.wrangler.json" --confirm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
